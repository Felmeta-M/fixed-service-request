services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffd_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: ffd_nginx
    restart: always
    ports:
      - "9991:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/docker-nginx:/var/log/nginx
    command: sh -c "rm -f /etc/logrotate.d/nginx /etc/cron.daily/logrotate 2>/dev/null || true; exec nginx -g 'daemon off;'"
    depends_on:
      - app
    networks:
      - app_net

  postgres:
    image: postgres:17
    container_name: fbb_pgsql
    restart: always
    ports:
      - "2345:5432"
    environment:
      POSTGRES_DB: ffd
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d ffd"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_net

  redis:
    image: redis:alpine
    container_name: ffd_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_net

volumes:
  pgdata:

networks:
  app_net:
    driver: bridge
