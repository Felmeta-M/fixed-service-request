# Staging stack: clone of production with host sync. Uses .env.staging (copy of .env.production with ffd→fbb).
# Run with: docker compose -f compose.staging.yml -p fbb_staging up -d
name: fbb-staging

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        VITE_APP_NAME: "Fixed services provision system (Staging)"
        VITE_API_BASE_URL: https://dev.fixedservices.ethiotelecom.et/api/v1
        VITE_API_PUBLIC_URL: https://dev.fixedservices.ethiotelecom.et/api/v1
    container_name: fbb_staging_app
    restart: always
    env_file:
      - .env.staging
    volumes:
      # Host sync: same code as production, edits on host apply in container
      - .:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo \"ok\";'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - fbb_staging_net
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "3"
        reservations:
          memory: 2g
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fbb_staging_scheduler
    restart: always
    env_file:
      - .env.staging
    volumes:
      - .:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    networks:
      - fbb_staging_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fbb_staging_queue
    restart: always
    env_file:
      - .env.staging
    volumes:
      - .:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    networks:
      - fbb_staging_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  queue-sms:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fbb_staging_queue_sms
    restart: always
    env_file:
      - .env.staging
    volumes:
      - .:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--queue=sms", "--sleep=2", "--tries=3", "--timeout=30"]
    networks:
      - fbb_staging_net
    deploy:
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: fbb_staging_nginx
    restart: always
    ports:
      - "9993:80"
    volumes:
      # Host sync: serve from same codebase as app
      - .:/var/www:ro
      - ./docker/nginx/default-staging.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - fbb_staging_net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  postgres:
    image: postgres:17
    container_name: fbb_staging_pgsql
    restart: always
    ports:
      - "2346:5432"
    environment:
      POSTGRES_DB: fbb
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d fbb"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fbb_staging_net
    shm_size: 2gb
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 2g
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=4GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c max_connections=100
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: fbb_staging_pgbouncer
    restart: always
    ports:
      - "6634:6432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://sa:secret@postgres:5432/fbb"
    volumes:
      - ./pgbouncer.staging.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=secret psql -h localhost -p 6432 -U sa -d fbb -c 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - fbb_staging_net

  redis:
    image: redis:alpine
    container_name: fbb_staging_redis
    restart: always
    ports:
      - "6364:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fbb_staging_net

volumes:
  pgdata:

networks:
  fbb_staging_net:
    driver: bridge
