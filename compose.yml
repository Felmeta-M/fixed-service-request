services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffd_app
    restart: always
    env_file:
      - .env
    volumes:
      - .:/var/www:ro
      - ./storage:/var/www/storage:rw
      - ./bootstrap/cache:/var/www/bootstrap/cache:rw
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  scheduler: # this is used to run the scheduler
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffd_scheduler
    restart: always
    env_file:
      - .env
    volumes:
      - .:/var/www:rw
      - ./storage:/var/www/storage:rw
      - ./bootstrap/cache:/var/www/bootstrap/cache:rw
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      DATABASE_URL: "pgsql://sa:secret@ffd_pgbouncer:6432/ffd"
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  queue: # this is used to run the queue worker
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffd_queue
    restart: always
    env_file:
      - .env
    volumes:
      - .:/var/www:ro
      - ./storage:/var/www/storage:rw
      - ./bootstrap/cache:/var/www/bootstrap/cache:rw
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      DATABASE_URL: "pgsql://sa:secret@ffd_pgbouncer:6432/ffd"
    command: >
      php artisan queue:work --sleep=3 --tries=3 --timeout=90
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"


  nginx:
    image: nginx:alpine
    container_name: ffd_nginx
    restart: always
    ports:
      - "9991:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_net

  postgres:
    image: postgres:17
    container_name: ffd_pgsql
    restart: always
    ports:
      - "2345:5432"
    environment:
      POSTGRES_DB: ffd
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d ffd"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_net
    shm_size: 8gb
    deploy:
      resources:
        limits:
          memory: 12g
        reservations:
          memory: 8g
    command: >
      postgres
      -c shared_buffers=8GB
      -c effective_cache_size=32GB
      -c work_mem=32MB
      -c maintenance_work_mem=1GB
      -c wal_compression=on
      -c random_page_cost=1.1
      -c autovacuum_vacuum_scale_factor=0.05
      -c autovacuum_analyze_scale_factor=0.02
      -c max_connections=150
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ffd_pgbouncer
    restart: always
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://sa:secret@ffd_pgsql:5432/ffd"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=secret psql -h localhost -p 6432 -U sa -d ffd -c 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_net

  redis:
    image: redis:alpine
    container_name: ffd_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_net

volumes:
  pgdata:

networks:
  app_net:
    driver: bridge
