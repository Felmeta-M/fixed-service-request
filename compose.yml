services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffd_app
    restart: always
    volumes:
      - ./:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - postgres
      - redis
    networks:
      - app_net

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffd_scheduler
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    depends_on:
      - app
    networks:
      - app_net

  nginx:
    image: nginx:alpine
    container_name: ffd_nginx
    restart: always
    ports:
      - "9991:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_net

  postgres:
    image: postgres:17
    container_name: ffd_pgsql
    restart: always
    ports:
      - "2345:5432"
    environment:
      POSTGRES_DB: ffd
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_net

  redis:
    image: redis:alpine
    container_name: ffd_redis
    ports:
      - "6379:6379"
    networks:
      - app_net

volumes:
  pgdata:

networks:
  app_net:
    driver: bridge
