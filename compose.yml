# --- IMMUTABLE (production): code from image only; named volumes (no host bindings).
# --- Currently using HOST SYNC below for quick iteration on user feedback; switch back by uncommenting immutable blocks and commenting host-sync
#
# Ports: <ServiceID><DefaultPort>. Production ServiceID = 1. e.g. 80→10080:80, 5432→15432:5432, 6432→16432:6432, 6379→16379:6379.
#
# Project name prefixes containers, volumes, and networks (e.g. fbb-app-1). Use `docker compose -p <name>` to run multiple stacks.
name: fbb

# One image for all PHP services — avoids building the same Dockerfile four times per `compose build`.
x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  args:
    VITE_APP_NAME: "Fixed services provision system"
    VITE_API_BASE_URL: https://fixedservices.ethiotelecom.et/api/v1
    VITE_API_PUBLIC_URL: https://fixedservices.ethiotelecom.et/api/v1
    VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}

services:
  app:
    image: fbb-php:latest
    build: *php-build
    restart: always
    env_file:
      - .env.production
    volumes:
      - fbb_storage:/var/www/storage/app
      - fbb_logs:/var/www/storage/logs
      - /var/log/fixed-services-logs/:/var/www/storage/logs
      - fbb_public:/var/www/public_volume
      # - .:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      # Immutable: verify build assets in public_volume
      # test: ["CMD-SHELL", "php -r 'echo \"ok\";' && test -d /var/www/public_volume/build/assets"]
      # Host sync: only verify PHP (build may be on host)
      test: ["CMD-SHELL", "php -r 'echo \"ok\";'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - fbb_net
    # Cap resources so second app (bill complaints) on same host is not starved.
    # Sized for 250 concurrent PHP workers (~80MB each). Swarm enforces; otherwise size host for both apps.
    deploy:
      resources:
        limits:
          memory: 20g
          cpus: "6"
        reservations:
          memory: 4g
          cpus: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  scheduler: # this is used to run the scheduler
    image: fbb-php:latest
    build: *php-build
    restart: always
    env_file:
      - .env
    volumes:
      - fbb_storage:/var/www/storage/app
      - fbb_logs:/var/www/storage/logs
      - /var/log/fixed-services-logs/:/var/www/storage/logs
      - fbb_public:/var/www/public_volume
      # - .:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      DATABASE_URL: "pgsql://sa:secret@pgbouncer:6432/ffd"
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    networks:
      - fbb_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  queue: # this is used to run the queue worker (default queue)
    image: fbb-php:latest
    build: *php-build
    restart: always
    env_file:
      - .env
    volumes:
      - fbb_storage:/var/www/storage/app
      - fbb_logs:/var/www/storage/logs
      - /var/log/fixed-services-logs/:/var/www/storage/logs
      - fbb_public:/var/www/public_volume
      # - .:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      DATABASE_URL: "pgsql://sa:secret@pgbouncer:6432/ffd"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    networks:
      - fbb_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  queue-sms: # dedicated SMS queue workers - scalable
    image: fbb-php:latest
    build: *php-build
    restart: always
    env_file:
      - .env
    volumes:
      - fbb_storage:/var/www/storage/app
      - fbb_logs:/var/www/storage/logs
      - /var/log/fixed-services-logs/:/var/www/storage/logs
      - fbb_public:/var/www/public_volume
      # - .:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    environment:
      DATABASE_URL: "pgsql://sa:secret@pgbouncer:6432/ffd"
    command: ["php", "artisan", "queue:work", "--queue=sms", "--sleep=2", "--tries=3", "--timeout=30"]
    networks:
      - fbb_net
    deploy:
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "10080:80"
    volumes:
      - fbb_public:/var/www/public:ro
      - fbb_storage:/var/www/storage:ro
      # - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - fbb_net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  postgres:
    image: postgres:17
    restart: always
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: ffd
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: secret
    volumes:
      - fixed-service-request_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d ffd"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fbb_net
    shm_size: 8gb
    deploy:
      resources:
        limits:
          memory: 12g
        reservations:
          memory: 8g
    command: >
      postgres
      -c shared_buffers=12GB
      -c effective_cache_size=32GB
      -c work_mem=32MB
      -c maintenance_work_mem=1GB
      -c wal_compression=on
      -c random_page_cost=1.1
      -c autovacuum_vacuum_scale_factor=0.05
      -c autovacuum_analyze_scale_factor=0.02
      -c max_connections=300
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    ports:
      - "16432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Use service name "postgres" and internal port 5432 (15432 is only for host→container)
      DATABASE_URL: "postgres://sa:secret@postgres:5432/ffd"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=secret psql -h localhost -p 6432 -U sa -d ffd -c 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fbb_net

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "16379:6379"
    command: redis-server --maxmemory 6gb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fbb_net
volumes:
  fixed-service-request_pgdata:
    name: fixed-service-request_pgdata
  fbb_storage:
    name: fbb_storage
  fbb_logs:
    name: fbb_logs
  fbb_public:
    name: fbb_public

networks:
  fbb_net:
    driver: bridge
