services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffd_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./:/var/www
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffd_scheduler
    restart: always
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      - app
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    networks:
      - app_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ffd_queue
    restart: always
    env_file:
      - .env
    volumes:
      - ./:/var/www
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      php artisan queue:work redis
      --sleep=3
      --tries=3
      --timeout=90
    networks:
      - app_net


  nginx:
    image: nginx:alpine
    container_name: ffd_nginx
    restart: always
    ports:
      - "9991:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - app_net

  postgres:
    image: postgres:17
    container_name: ffd_pgsql
    restart: always
    ports:
      - "2345:5432"
    environment:
      POSTGRES_DB: ffd
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d ffd"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_net

  redis:
    image: redis:alpine
    container_name: ffd_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_net

volumes:
  pgdata:

networks:
  app_net:
    driver: bridge
