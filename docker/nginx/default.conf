# ============================================================================
# Nginx Configuration — Ethio Telecom Fixed Service Request Management
# ============================================================================
#
# Architecture:
#   Client (HTTPS) -> Host Proxy (SSL termination) -> Docker Nginx (HTTP :80) -> PHP-FPM (:9000)
#
# This server block handles HTTP traffic inside the Docker network.
# SSL/TLS is terminated by the upstream host-level reverse proxy
# (see docker/nginx/host-proxy.conf.example).
# ============================================================================

# ---------------------------------------------------------------------------
# Rate Limiting: DISABLED at nginx for shared public IPs
# ---------------------------------------------------------------------------
# Many customers use shared public addresses (NAT, mobile carriers, corporate
# proxies). Per-IP limiting here would block all of them when one IP is used.
# Throttling is handled by Laravel (per-user for API when authenticated).
# ---------------------------------------------------------------------------

server {
    # -----------------------------------------------------------------------
    # Listener
    # -----------------------------------------------------------------------
    # Listen on port 80 (HTTP only). SSL is NOT handled here — it is
    # terminated by the host-level reverse proxy before traffic reaches
    # this container.
    # -----------------------------------------------------------------------
    listen 80;

    # -----------------------------------------------------------------------
    # Server Names
    # -----------------------------------------------------------------------
    # Accept requests for both "localhost" (dev/internal) and the production
    # domain. Requests with other Host headers are ignored by this block.
    # -----------------------------------------------------------------------
    server_name localhost fixedservices.ethiotelecom.et;

    # -----------------------------------------------------------------------
    # Document Root
    # -----------------------------------------------------------------------
    # Points to Laravel's public/ directory inside the container.
    # Only files in this directory are directly accessible by the web server.
    # -----------------------------------------------------------------------
    root /var/www/public;
    index index.php index.html;

    # -----------------------------------------------------------------------
    # Request Size Limit
    # -----------------------------------------------------------------------
    # Maximum allowed size for the request body (file uploads, form posts).
    # Set to 100 MB to allow large file/document uploads.
    # -----------------------------------------------------------------------
    client_max_body_size 100M;

    # -----------------------------------------------------------------------
    # Large Header Buffers
    # -----------------------------------------------------------------------
    # Allows up to 4 buffers of 64 KB each for reading large client request
    # headers. Prevents 414 (URI Too Long) or 400 (Bad Request) errors when
    # requests carry large cookies, OAuth tokens, or long query strings.
    # -----------------------------------------------------------------------
    large_client_header_buffers 4 64k;

    # -----------------------------------------------------------------------
    # Static Assets — Vite Build Output
    # -----------------------------------------------------------------------
    # Serves pre-compiled frontend assets (JS, CSS, images) generated by
    # Vite. These files are fingerprinted (hashed filenames) so they are
    # safe to cache aggressively. Access/404 logs are disabled to reduce
    # noise for static asset requests.
    # -----------------------------------------------------------------------
    location /build/ {
        alias /var/www/public/build/;
        try_files $uri $uri/ =404;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Laravel Application Routes
    # -----------------------------------------------------------------------
    # All non-file requests are routed to Laravel's front controller
    # (index.php). The "try_files" directive first checks for a matching
    # static file or directory, then falls back to index.php.
    #
    # No nginx rate limiting (shared public IPs). Laravel throttles per route.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -----------------------------------------------------------------------
    # PHP-FPM — Application Processing
    # -----------------------------------------------------------------------
    # Routes all .php requests to the PHP-FPM service (ffd_app container)
    # over FastCGI on port 9000.
    #
    # Buffer settings:
    #   - fastcgi_buffers 16 16k   : 16 buffers of 16 KB for response body
    #   - fastcgi_buffer_size 32k  : 32 KB for the first part of the response
    #                                 (headers). Prevents "upstream sent too
    #                                 big header" errors with Filament/Livewire.
    #
    # Proxy Headers:
    #   Since SSL terminates at the host proxy (not here), Laravel needs to
    #   know the original request used HTTPS. These headers tell Laravel:
    #   - X-Forwarded-Proto: "https"  — original scheme (always https in prod)
    #   - X-Forwarded-Host:  $host    — original hostname from the request
    #   - X-Forwarded-For:   client   — original client IP address
    #
    #   Combined with Laravel's trustProxies(at: '*') in bootstrap/app.php,
    #   this ensures:
    #   - URL::forceScheme('https') works correctly
    #   - Signed URL validation matches (prevents 403 "Invalid signature")
    #   - request()->ip() returns the real client IP, not the proxy's
    #
    # Content-Security-Policy:
    #   Set here so reCAPTCHA (trouble ticket / complaint form) and Maps work
    #   regardless of Laravel DISABLE_HTTP_SECURITY. Includes script-src and
    #   script-src-elem for Google reCAPTCHA (google.com + recaptcha.net).
    # -----------------------------------------------------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass ffd_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_param HTTP_X_FORWARDED_PROTO "https";
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://maps.googleapis.com https://www.google.com https://www.gstatic.com https://www.recaptcha.net; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://maps.googleapis.com https://www.google.com https://www.gstatic.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-src 'self' https://www.google.com https://www.recaptcha.net; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none';" always;
    }

    # -----------------------------------------------------------------------
    # Security — Block Dot Files
    # -----------------------------------------------------------------------
    # Denies access to hidden files and directories (e.g., .env, .git,
    # .htaccess) that could leak sensitive configuration or credentials.
    # Exception: .well-known/ is allowed for ACME/Let's Encrypt challenges
    # and other standard discovery protocols.
    # -----------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    # Disabled at the Nginx level. Application-level logging is handled by
    # Laravel (storage/logs/) and the LogHttpRequests middleware. This
    # reduces disk I/O and avoids duplicate log entries.
    # -----------------------------------------------------------------------
    access_log on;
    error_log on;
}
