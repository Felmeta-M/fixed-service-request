[www]
; PHP-FPM Pool Configuration - Optimized for high concurrency

user = www-data
group = www-data

listen = 9000

; Process Manager Configuration
; Using dynamic for flexible scaling (tuned for high traffic + second app on same host)
pm = dynamic

; Maximum number of child processes - ~100 concurrent PHP requests; memory capped via container limits
pm.max_children = 100

; Number of children created on startup
pm.start_servers = 25

; Minimum number of idle server processes
pm.min_spare_servers = 15

; Maximum number of idle server processes
pm.max_spare_servers = 45

; Number of requests each child should execute before respawning
pm.max_requests = 500

; Timeout for child processes
request_terminate_timeout = 300

; Slow log for debugging
slowlog = /var/www/storage/logs/php-fpm-slow.log
request_slowlog_timeout = 5s

; Status page for monitoring
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
