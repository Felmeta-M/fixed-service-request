# Dev stack: run locally (e.g. Mac) for stress testing against http://localhost:30080/
#
# Ports: dev uses ServiceID 3 → 30080 (HTTP), 35432 (postgres), 36432 (pgbouncer), 36379 (redis).
#
# Run from the REPOSITORY ROOT so app code and config are found (context and volumes use ..):
#
#   cd /path/to/fixed-service-request
#   cp .env .env.dev && # edit .env.dev: APP_ENV=local, DB_HOST=fbb_dev_pgbouncer, DB_DATABASE=ffd, REDIS_HOST=fbb_dev_redis
#   docker compose -f fixed-services-config/compose.dev.yml -p fbb_dev up -d
#   # After healthy: python scripts/stress/simple_load.py --url http://localhost:30080/ --concurrency 10 --total 200
#
name: fbb_dev

services:
  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
      args:
        VITE_APP_NAME: "Fixed services (Dev)"
        VITE_API_BASE_URL: http://localhost:30080/api/v1
        VITE_API_PUBLIC_URL: http://localhost:30080/api/v1
        VITE_TURNSTILE_SITE_KEY: "REDACTED_TURNSTILE_SITE_KEY"
    container_name: fbb_dev_app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - APP_ENV=local
      - DB_HOST=fbb_dev_pgbouncer
      - REDIS_HOST=fbb_dev_redis
    volumes:
      - ..:/var/www
      - ../docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo \"ok\";'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - fbb_dev_net
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2"

  scheduler:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: fbb_dev_scheduler
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - APP_ENV=local
      - DATABASE_URL=pgsql://sa:secret@fbb_dev_pgbouncer:6432/ffd
      - REDIS_HOST=fbb_dev_redis
    volumes:
      - ..:/var/www
      - ../docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    networks:
      - fbb_dev_net

  queue:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: fbb_dev_queue
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - APP_ENV=local
      - DATABASE_URL=pgsql://sa:secret@fbb_dev_pgbouncer:6432/ffd
      - REDIS_HOST=fbb_dev_redis
    volumes:
      - ..:/var/www
      - ../docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90"]
    networks:
      - fbb_dev_net

  nginx:
    image: nginx:alpine
    container_name: fbb_dev_nginx
    restart: unless-stopped
    ports:
      - "30080:80"
    volumes:
      - ..:/var/www:ro
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - fbb_dev_net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  postgres:
    image: postgres:17
    container_name: fbb_dev_pgsql
    restart: unless-stopped
    ports:
      - "35432:5432"
    environment:
      POSTGRES_DB: fbb
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d fbb"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fbb_dev_net
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 2g
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=4MB
      -c maintenance_work_mem=128MB
      -c max_connections=80

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: fbb_dev_pgbouncer
    restart: unless-stopped
    ports:
      - "36432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://sa:secret@postgres:5432/fbb"
    volumes:
      - ./pgbouncer.dev.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=secret psql -h localhost -p 6432 -U sa -d fbb -c 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - fbb_dev_net

  redis:
    image: redis:alpine
    container_name: fbb_dev_redis
    restart: unless-stopped
    ports:
      - "36379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fbb_dev_net

volumes:
  pgdata_dev:

networks:
  fbb_dev_net:
    driver: bridge
