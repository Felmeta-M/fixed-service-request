# ============================================================================
# Docker Nginx — Fixed Service Request STAGING
# ============================================================================
#
# PURPOSE:
#   Serves the staging app inside the Docker network. Accepts requests with
#   Host: fixedservices.ethiotelecom.et (when host proxy uses :8443) or
#   localhost (when proxy uses :20080). Passes PHP to fbb_staging_app:9000.
#
# BOTTLENECK / DESIGN:
#   No Nginx rate limiting (shared public IPs); Laravel throttles per route.
#   X-Forwarded-* from host proxy are passed through so Laravel sees real
#   scheme, host, and client IP. Buffers sized for large Filament/Livewire
#   responses.
#
# Used by: compose.staging.yml (nginx service). Host proxy forwards to
#   host port 20080, which maps to this container's port 80.
# ============================================================================

server {
    listen 80;
    server_name localhost fixedservices.ethiotelecom.et;

    root /var/www/public;
    index index.php index.html;
    client_max_body_size 100M;
    large_client_header_buffers 4 64k;

    # Vite build output — fingerprinted assets; cache aggressively, no access log
    location /build/ {
        alias /var/www/public/build/;
        try_files $uri $uri/ =404;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM — staging app container (compose.staging.yml service name: app, container: fbb_staging_app)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass fbb_staging_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Forward proxy headers so Laravel gets real scheme, host, client IP
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # Block hidden files; allow .well-known for ACME
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log on;
    error_log on;
}
