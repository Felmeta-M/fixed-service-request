# ============================================================================
# Nginx Configuration — Ethio Telecom Fixed Service Request (ACTIVE)
# ============================================================================
#
# PURPOSE:
#   Serves the Laravel app inside the Docker network. Handles HTTP only;
#   SSL is terminated by the host-level reverse proxy (see docker/nginx/
#   host-proxy.conf.example and host-proxy-dev.fixedservices.conf.example).
#
# BOTTLENECK / DESIGN:
#   Rate limiting at Nginx is DISABLED because many users share public IPs
#   (NAT, mobile); Laravel handles throttling per route. Buffer sizes
#   (fastcgi_buffers, large_client_header_buffers) prevent "upstream sent too
#   big header" and 414/400 from large cookies or OAuth tokens.
#
# Architecture:
#   Client (HTTPS) -> Host Proxy (SSL) -> Docker Nginx (HTTP :80) -> PHP-FPM (app:9000)
# ============================================================================

# ---------------------------------------------------------------------------
# Rate Limiting: DISABLED at nginx for shared public IPs
# ---------------------------------------------------------------------------
# Many customers use shared public addresses (NAT, mobile carriers, corporate
# proxies). Per-IP limiting here would block all of them when one IP is used.
# Throttling is handled by Laravel (per-user for API when authenticated).
# ---------------------------------------------------------------------------

server {
    # -----------------------------------------------------------------------
    # Listener
    # -----------------------------------------------------------------------
    listen 80;

    # -----------------------------------------------------------------------
    # Server Names
    # -----------------------------------------------------------------------
    server_name localhost fixedservices.ethiotelecom.et;

    # -----------------------------------------------------------------------
    # Document Root
    # -----------------------------------------------------------------------
    root /var/www/public;
    index index.php index.html;

    # -----------------------------------------------------------------------
    # Request Size Limit
    # -----------------------------------------------------------------------
    client_max_body_size 100M;

    # -----------------------------------------------------------------------
    # Large Header Buffers
    # -----------------------------------------------------------------------
    large_client_header_buffers 4 64k;

    # -----------------------------------------------------------------------
    # Static Assets — Vite Build Output
    # -----------------------------------------------------------------------
    location /build/ {
        alias /var/www/public/build/;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Laravel Application Routes
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -----------------------------------------------------------------------
    # PHP-FPM — Application Processing
    # -----------------------------------------------------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        fastcgi_param HTTP_X_FORWARDED_PROTO "https";
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # -----------------------------------------------------------------------
    # Security — Block Dot Files
    # -----------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    access_log on;
    error_log on;
}
