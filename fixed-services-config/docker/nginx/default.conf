# ============================================================================
# Nginx Configuration — Ethio Telecom Fixed Service Request (Template)
# ============================================================================
#
# This is the reference/template config kept in fixed-services-config/.
# The active config used by Docker is at docker/nginx/default.conf.
#
# Architecture:
#   Client (HTTPS) -> Host Proxy (SSL termination) -> Docker Nginx (HTTP :80) -> PHP-FPM (:9000)
# ============================================================================

# ---------------------------------------------------------------------------
# Rate Limiting
# ---------------------------------------------------------------------------
# Shared memory zone "one" (10 MB) — tracks requests per client IP.
# Allows 10 requests/second per IP. Stricter than the active config (20r/s)
# as a conservative baseline. Adjust per environment.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

server {
    # -----------------------------------------------------------------------
    # Listener — HTTP only (SSL terminated upstream by host proxy)
    # -----------------------------------------------------------------------
    listen 80;

    # -----------------------------------------------------------------------
    # Server Name — localhost only (template default)
    # For production, add the domain: localhost fixedservices.ethiotelecom.et
    # -----------------------------------------------------------------------
    server_name localhost;

    # -----------------------------------------------------------------------
    # Document Root — Laravel public/ directory
    # -----------------------------------------------------------------------
    root /var/www/public;
    index index.php index.html;

    # -----------------------------------------------------------------------
    # Request Size — 100 MB max (supports file uploads)
    # -----------------------------------------------------------------------
    client_max_body_size 100M;

    # -----------------------------------------------------------------------
    # Buffer Settings
    # -----------------------------------------------------------------------
    # proxy_buffer_size / proxy_buffers:
    #   Buffers for proxied responses. Prevents "upstream sent too big header"
    #   errors when responses contain large headers (e.g., Set-Cookie, CORS).
    #
    # large_client_header_buffers:
    #   4 buffers of 64 KB for reading large client request headers
    #   (cookies, OAuth tokens, long URIs).
    # -----------------------------------------------------------------------
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 4 64k;

    # -----------------------------------------------------------------------
    # Static Assets — Vite Build Output
    # -----------------------------------------------------------------------
    # Fingerprinted assets (JS, CSS) from Vite. Safe to cache aggressively.
    # Logs disabled to reduce noise.
    # -----------------------------------------------------------------------
    location /build/ {
        alias /var/www/public/build/;
        try_files $uri $uri/ =404;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Laravel Application Routes
    # -----------------------------------------------------------------------
    # Falls back to index.php for all non-static requests.
    # Rate limit: burst=20 (stricter than active config's burst=40).
    # -----------------------------------------------------------------------
    location / {
        limit_req zone=one burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # -----------------------------------------------------------------------
    # PHP-FPM — Application Processing
    # -----------------------------------------------------------------------
    # Routes .php requests to the ffd_app container over FastCGI port 9000.
    #
    # NOTE: For production, add these proxy headers so Laravel can detect
    # the original HTTPS scheme (needed for signed URL validation, etc.):
    #
    #   fastcgi_param HTTP_X_FORWARDED_PROTO "https";
    #   fastcgi_param HTTP_X_FORWARDED_HOST  $host;
    #   fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
    #
    # Also configure trustProxies(at: '*') in Laravel's bootstrap/app.php.
    # -----------------------------------------------------------------------
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass ffd_app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # -----------------------------------------------------------------------
    # Security — Block Dot Files
    # -----------------------------------------------------------------------
    # Denies access to hidden files (.env, .git, .htaccess).
    # Exception: .well-known/ for ACME/Let's Encrypt challenges.
    # -----------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # -----------------------------------------------------------------------
    # Logging — Disabled (handled by Laravel's LogHttpRequests middleware)
    # -----------------------------------------------------------------------
    access_log off;
    error_log off;
}
