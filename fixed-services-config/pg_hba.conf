# PostgreSQL client authentication — reference for Fixed Service Request
# Copy or merge into your pg_hba.conf. Reload with pg_ctl reload or SELECT pg_reload_conf().

# TYPE  DATABASE  USER         ADDRESS         METHOD
local   all       all                           trust
host    all       all           127.0.0.1/32    trust
host    all       all           ::1/128         trust
local   replication all                         trust
host    replication all         127.0.0.1/32   trust
host    replication all         ::1/128        trust

# Non-local: require password (adjust ADDRESS/METHOD per your environment)
host    all       all           all             scram-sha-256
# Replication from backup/standby host (adjust IP and user)
host    replication replicator  10.117.66.12/32 md5
host    all       replicator    10.117.66.12/32 md5
